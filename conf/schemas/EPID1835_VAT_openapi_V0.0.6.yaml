- description: Operations for Value Added Tax Scheme related to their VAT Subscription
  name: subscriptions
paths:
  /RESTAdapter/vat/subscription:
    post:
      deprecated: false
      description: |-
        This API provides the ability for a taxpayer (Business or Individual) to subscribe the VAT service on ETMP.

        The call is synchronous.

        For the successful scenario the API will creates the necessary additional master data (storing the correspondence details) or updates the existing data, depending on the type of request .

        For the unsuccessful scenario, the API will return error messages.

        Legacy API#1364

        EPID reference:

        EPID1833
      operationId: createVatSubscription
      parameters:
      - $ref: "#/components/parameters/correlationid"
      - $ref: "#/components/parameters/Credential-Id"
      - $ref: "#/components/parameters/X-Originating-System"
      - $ref: "#/components/parameters/X-Receipt-Date"
      - $ref: "#/components/parameters/X-Session-ID"
      - $ref: "#/components/parameters/X-Transmitting-System"
      requestBody:
        content:
          application/json:
            examples:
              CreateRequestExample:
                $ref: "#/components/examples/CreateRequestExample"
            schema:
              $ref: "#/components/schemas/request"
        description: ""
        required: true
      responses:
        "201":
          content:
            application/json:
              examples:
                Response Example:
                  $ref: "#/components/examples/201_CreateSubsResponseExample"
              schema:
                $ref: "#/components/schemas/CreateVatSubscriptionSuccessResponse"
          description: Success
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid"
        "400":
          content:
            application/json:
              schema:
                required:
                - origin
                type: object
                properties:
                  origin:
                    $ref: "#/components/schemas/HIP-originEnum"
                  response:
                    oneOf:
                    - $ref: "#/components/schemas/HIP-failureResponse"
                    - $ref: "#/components/schemas/SystemErrorResponse"
                additionalProperties: false
              examples:
                HIP-originResponse:
                  description: HIP-originResponse
                  value:
                    origin: HIP
                    response:
                      failures:
                      - type: Type of Failure
                        reason: Reason for Failure
          description: Bad Request
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notfound"
        "422":
          $ref: "#/components/responses/unprocessableEntityCreateVatSubscription"
        "500":
          content:
            application/json:
              examples:
                "500 Error Example":
                  value:
                    origin: HoD
                    response:
                      error:
                        code: "500"
                        logID: D82EBAB67AC6D7565C0682CA91BDC577
                        message: string
                HIP-originResponse:
                  description: HIP-originResponse
                  value:
                    origin: HIP
                    response:
                      failures:
                      - type: Type of Failure
                        reason: Reason for Failure
              schema:
                required:
                - origin
                type: object
                properties:
                  origin:
                    $ref: "#/components/schemas/HIP-originEnum"
                  response:
                    oneOf:
                    - $ref: "#/components/schemas/HIP-failureResponse"
                    - $ref: "#/components/schemas/SystemErrorResponse"
                additionalProperties: false
          description: Internal Server Error
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid"
        "503":
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/HIP-originResponse"
          description: Service Unavailable
      summary: Create VAT subscription
      tags:
      - subscriptions
  /RESTAdapter/vat/subscription/{idType}/{idValue}:
    get:
      deprecated: false
      description: "This particular API provides the ability for a Taxpayer (Business\
        \ or Individual) to display a subscription.\n\nThe call is synchronous.\n\n\
        For the successful scenario the API retrieve the latest subscription details.\n\
        \nFor the unsuccessful scenario, the API will return error messages.\n\n Legacy\
        \ API#1363 \n\nEPID reference:\n\nEPID1834"
