openapi: 3.0.3
info:
  description: "This API specification provides the ability for a Taxpayer (Business\
    \ or Individual) subscription to theVAT tax regime.\n\nThe following resources\
    \ are offered by these APIs:\n\n**Subscriptions**\n\nProvides ability to create\
    \ and display of VAT Subscription.\n\n**Subscriptions for VAT Customer Information\
    \ and Subscription**\n-  Subscription Create\n-  Subscription Display\n\n**EPID\
    \ references:**\n\n-  EPID1835-HIP OAS: VAT Customer Information and Subscription\
    \ (VAT)\n\n**Change Log**\n| Version | Date | Author | Description |\n|---|---|---|---|\n\
    | 0.0.1 | 2026-06-30 | HIP OAS Agent | Initial HIP onboarding |\n| 0.0.2 | 2026-08-19\
    \ | Rajkumar Pochammal | Updated the EPID numbers, summary descriptions, and correction\
    \ ID descriptions. Updated the Get/Display Subscription path, changed idType and\
    \ idValue to simple types, and updated the 422 ETMP error codes, messages, and\
    \ examples.  | \n| 0.0.3 | 2026-09-09 | Rajkumar Pochammal | In the Create API,\
    \ SessionID and CredentialID were added to the header, and the messageType enum\
    \ values and 404 response were updated.In the Display API, missing data elements\
    \ for zeroRatedExmpApplicationType were added, the 089 error message was updated\
    \ to  Form Number , and the 404 response was updated. \n| 0.0.4 | 2026-09-28 |\
    \ Rajkumar Pochammal | Create And Display APIs, Renamed the 422 Validation errors\
    \ schema node from errors to error and updated the corresponding validation error\
    \ examples. |\n| 0.0.5 | 2026-10-05 | Rajkumar Pochammal | Create And Display\
    \ APIs - Updated patterns for the following fields as agreed during the 2 October\
    \ discussion.\n||||BusinessName,OrganisationName,TradingName and AccountName (\
    \ i.e 1,160)\n||||NameOfSupplier,PreviousOwnerName,ShortenedName ( i.e 1,105)\n\
    ||||AddressLines ( i.e 1,35)\n||||Display API- Datatype updated from Boolean to\
    \ String for the following fields: mandationStatus,commsPreference and returnPeriod\n\
    ||||Display API example updated ||\n| 0.0.6 | 2026-10-09 | Rajkumar Pochammal\
    \ | Create And Display APIs - Pattern updated to include the asterisk (*) character\
    \ for BusinessName, OrganisationName, TradingName, AccountName, and AddressLines.\
    \ \n||||The AccountName length updated to 1-60 characters. \n|||| The TradingName\
    \ description updated. "
